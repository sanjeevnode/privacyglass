<!-- PrivacyGlass app icon.
     Deliberately unrelated to WhatsApp's mark: no green, no phone, no speech
     bubble. A frosted lens over hidden text: the blur metaphor, literally. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C6FFF"/>
      <stop offset="1" stop-color="#7A3DF5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Rounded-square ground -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Text lines behind the lens: sharp at the edges, blurred where covered. -->
  <g fill="#FFFFFF" opacity="0.42">
    <rect x="96"  y="150" width="228" height="26" rx="13"/>
    <rect x="96"  y="206" width="300" height="26" rx="13"/>
  </g>
  <g fill="#FFFFFF" opacity="0.42" filter="url(#soften)">
    <rect x="96"  y="262" width="270" height="26" rx="13"/>
    <rect x="96"  y="318" width="190" height="26" rx="13"/>
  </g>

  <!-- The lens itself -->
  <circle cx="318" cy="306" r="118" fill="url(#glass)" opacity="0.30"/>
  <circle cx="318" cy="306" r="118" fill="none" stroke="#FFFFFF"
          stroke-width="20" stroke-opacity="0.92"/>
  <!-- Handle, angled away from the lines -->
  <rect x="392" y="380" width="34" height="104" rx="17" fill="#FFFFFF"
        opacity="0.92" transform="rotate(-45 409 432)"/>
  <!-- Highlight -->
  <path d="M258 268 a118 118 0 0 1 44 -44" fill="none" stroke="#FFFFFF"
        stroke-width="16" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
